# ============================================================================
# odds-shopper — Render blueprint
#
# Env vars marked `sync: false` are NEVER read from git. After the blueprint
# creates these services you must paste them into EACH service's Environment
# tab in the Render dashboard: SUPABASE_URL, SUPABASE_KEY, ODDS_API_KEY.
# (The web service also takes CAPTURE_TOKEN.) See DEPLOY.md.
#
# CREDIT BUDGET (The Odds API bills markets x regions = 3 credits per call):
#   ncaaf-sunday (opens)   24 runs/wk  x3 =  72 credits/wk
#   ncaaf-sat    (closes)  36 runs/wk  x3 = 108 credits/wk
#   ncaaf-late   (closes)  24 runs/wk  x3 =  72 credits/wk
#                                    NCAAF total ~1,090 credits/month
#   nflpre-open   1 run/day   x3 =   3 credits/day
#   nflpre-close 15 runs/day  x3 =  45 credits/day  (August only, ~1,150 total)
#
# The free tier is 500 credits/month and will NOT cover this. Either move to a
# paid Odds API plan, or leave ODDS_API_KEY unset on the cron services to fall
# back to free ActionNetwork data (~15-30 min delayed close, but MORE books:
# it adds Caesars + bet365). See DEPLOY.md "Choosing your data plan".
# ============================================================================

envVarGroups:
  # Pasted ONCE at blueprint creation and linked to every cron below. This repo has
  # already lost time to a corrupted Render env var paste (see commit dd9163a), and
  # pasting a 219-char service_role key five times is five chances to repeat that.
  # It is also the single place to rotate the key -- which matters, because the anon
  # key that used to live here is public in this repo's history.
  - name: clv-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false     # service_role, NOT anon -- anon cannot write once RLS is on

# ODDS_API_KEY is deliberately absent. The free-tier balance is exhausted (500/500 on
# 2026-08-17), and a set-but-dead key makes every call 401 and the cron exit FAILED.
# Leaving it unset falls back to ActionNetwork, which works. To re-enable later, add
# it to a service in the dashboard or back into this file.

services:
  # ── Web app: interactive line shopper ──────────────────────────────────────
  # NOT managed by this blueprint. The web service was created by hand before the
  # blueprint ever ran, and it is live at odds-shopper.onrender.com. Declaring it
  # here would collide on the name, and renaming the existing one to resolve that
  # would move its public URL. The web app is also irrelevant to capture — the crons
  # write to Supabase directly and never call it — so leaving it out costs nothing.
  # Re-enable this block only if you want the blueprint to own the web service too,
  # which means deleting or renaming the hand-made one first.
  #
  #  - type: web
  #    name: odds-shopper
  #    env: python
  #    buildCommand: pip install -r requirements.txt
  #    startCommand: gunicorn app:app
  #    envVars:
  #      - key: ODDS_API_KEY
  #        sync: false
  #      - key: SUPABASE_URL
  #        sync: false
  #      - key: SUPABASE_KEY
  #        sync: false
  #      - key: CAPTURE_TOKEN
  #        sync: false

  # ── NCAAF opens: hourly all Sunday ─────────────────────────────────────────
  # Next week's college lines drop at unpredictable times on Sunday. Hourly
  # coverage is what makes the recorded "open" the real open.
  - type: cron
    name: odds-shopper-capture-ncaaf-sunday
    env: python
    schedule: "0 * * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_cron.py
    envVars:
      - fromGroup: clv-secrets
      - key: CAPTURE_SPORTS
        value: ncaaf

  # ── NCAAF closes: Saturday game window, every 15 min ───────────────────────
  # UTC 15:00-23:45 Sat ≈ 11am-7:45pm ET. The last snapshot before kickoff is
  # the close, so frequency here is what determines CLV grading accuracy.
  - type: cron
    name: odds-shopper-capture-sat
    env: python
    schedule: "*/15 15-23 * * 6"
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_cron.py
    envVars:
      - fromGroup: clv-secrets
      - key: CAPTURE_SPORTS
        value: ncaaf

  # ── NCAAF closes: late West Coast games, into Sunday UTC ───────────────────
  # UTC 00:00-05:45 Sun ≈ 8pm Sat-1:45am ET.
  - type: cron
    name: odds-shopper-capture-late
    env: python
    schedule: "*/15 0-5 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_cron.py
    envVars:
      - fromGroup: clv-secrets
      - key: CAPTURE_SPORTS
        value: ncaaf

  # ── NFL PRESEASON opens: once daily ────────────────────────────────────────
  # Preseason runs early Aug through late Aug. Low-volume opens capture, and it
  # doubles as a live end-to-end test of the whole pipeline before CFB Week 0.
  - type: cron
    name: odds-shopper-capture-nflpre-open
    env: python
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_cron.py
    envVars:
      - fromGroup: clv-secrets
      - key: CAPTURE_SPORTS
        value: nflpre

  # ── NFL PRESEASON closes: evening kickoff window, every 20 min ─────────────
  # UTC 22:00-23:59 + 00:00-02:59 ≈ 6pm-11pm ET, covering the 7pm/8pm ET slate.
  - type: cron
    name: odds-shopper-capture-nflpre-close
    env: python
    schedule: "*/20 22-23,0-2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python capture_cron.py
    envVars:
      - fromGroup: clv-secrets
      - key: CAPTURE_SPORTS
        value: nflpre

